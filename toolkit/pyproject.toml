[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded"
version = "1.1.0"
description = "Source-scoped bounded composition, complex records, forgetting and response models for The Bounded Observer"
authors = [{name = "Daniel John Murray"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10"]

[tool.setuptools]
packages = ["bounded"]
